<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rick and Morty - Vanilla JS</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #202329;
      color: white;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #00b0c8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 20px auto;
    }
    .card {
      background-color: #3c3e44;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
    }
    .card img {
      width: 100%;
      display: block;
    }
    .card-info {
      padding: 12px;
    }
    .card-info h3 {
      margin: 8px 0;
    }
    .status {
      font-size: 0.9rem;
      color: #9e9e9e;
    }
  </style>
</head>
<body>

  <h1>Personajes de Rick and Morty</h1>
  
  <!-- Aquí pintaremos los personajes -->
  <main id="contenedor-personajes" class="grid"></main>

  <script src="script.js"></script>
</body>
</html>
